name: stockverity

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockverity}
      POSTGRES_USER: ${POSTGRES_USER:-stockverity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-stockverity};Username=${POSTGRES_USER:-stockverity};Password=${POSTGRES_PASSWORD}
      JwtSettings__SecretKey: ${JWT_SECRET:?Set JWT_SECRET to at least 32 characters in .env}
      JwtSettings__Issuer: StockVerity
      JwtSettings__Audience: StockVerityUsers
      JwtSettings__ExpiryMinutes: 60
      JwtSettings__RefreshTokenExpiryDays: 7
      DataProtection__KeysPath: /app/data-protection-keys
      Database__ApplyMigrations: ${APPLY_MIGRATIONS:-false}
      DemoData__Enabled: ${DEMO_DATA_ENABLED:-false}
      OpenApi__Enabled: ${OPENAPI_ENABLED:-false}
      HttpsRedirection__Enabled: "false"
      Cors__AllowedOrigins__0: http://localhost:${UI_PORT:-3000}
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - dataprotection_keys:/app/data-protection-keys
      - api_logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.blazor
    ports:
      - "${UI_PORT:-3000}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
    restart: unless-stopped
    depends_on:
      - api

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  dataprotection_keys:
  api_logs:
