name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STOCKVERITY_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore InventoryAPI.sln

      - name: Build
        run: dotnet build InventoryAPI.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/InventoryAPI.UnitTests -c Release --no-build --logger "console;verbosity=minimal"

      - name: PostgreSQL HTTP integration tests
        run: dotnet test tests/InventoryAPI.IntegrationTests -c Release --no-build --logger "console;verbosity=minimal"

      - name: Publish API and web client
        run: |
          dotnet publish src/InventoryAPI.Api/InventoryAPI.Api.csproj -c Release --no-build -o artifacts/api
          dotnet publish src/InventoryAPI.BlazorUI/InventoryAPI.BlazorUI.csproj -c Release --no-build -o artifacts/ui

  compose-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and exercise the full stack
        run: ./scripts/smoke-compose.sh
